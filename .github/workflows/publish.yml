name: Publish npm packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Verify MCP
        run: npm run verify:mcp

      - name: Check package contents
        run: npm run pack:check

      - name: Check published versions
        id: versions
        shell: bash
        run: |
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          MCP_VERSION="$(node -p "require('./packages/chatrail-mcp/package.json').version")"

          if npm view "@pedroantonnio/chatrail@$ROOT_VERSION" version >/dev/null 2>&1; then
            echo "publish_root=false" >> "$GITHUB_OUTPUT"
            echo "@pedroantonnio/chatrail@$ROOT_VERSION is already published"
          else
            echo "publish_root=true" >> "$GITHUB_OUTPUT"
          fi

          if npm view "@pedroantonnio/chatrail-mcp@$MCP_VERSION" version >/dev/null 2>&1; then
            echo "publish_mcp=false" >> "$GITHUB_OUTPUT"
            echo "@pedroantonnio/chatrail-mcp@$MCP_VERSION is already published"
          else
            echo "publish_mcp=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ChatRail
        if: steps.versions.outputs.publish_root == 'true'
        run: npm publish --access public

      - name: Publish ChatRail MCP
        if: steps.versions.outputs.publish_mcp == 'true'
        run: npm publish --workspace @pedroantonnio/chatrail-mcp --access public
