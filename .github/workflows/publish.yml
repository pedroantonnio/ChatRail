name: Publish npm packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Verify MCP
        run: npm run verify:mcp

      - name: Check package contents
        run: npm run pack:check

      - name: Publish ChatRail
        run: npm publish --access public

      - name: Publish ChatRail MCP
        run: npm publish --workspace @pedroantonnio/chatrail-mcp --access public